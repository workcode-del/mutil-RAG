project:
  data_dir: data
  artifacts_dir: outputs

# 默认单环境、本进程运行。HTTP模式只用于显存隔离或远程部署。
runtime:
  mode: local
  device: cuda
  qwen3_vl_retrieval_repo: third_party/Qwen3-VL-Embedding

# 模型始终先检查local_path；不存在时才从ModelScope下载到统一缓存。
model_download:
  source: modelscope
  cache_dir: data/models

parsing:
  backend: mineru
  sentence_locator: pymupdf
  figure_reference_patterns:
    - '(?i)\bfig(?:ure)?\.?\s*(\d+[a-z]?)'

chart:
  enabled: true
  accept_types: [line_chart]
  min_classifier_confidence: 0.70
  # 主环境中的Transformers 4.57.6需同时兼容MinerU与Qwen检索。
  # PP-Chart2Table依赖Transformers 5.x，因此默认通过外部多模态API解析折线图。
  backend: openai_compatible
  base_url: http://localhost:8001/v1
  model: Qwen/Qwen3-VL-4B-Instruct
  api_key_env: PAPER_RAG_API_KEY
  timeout: 120
  temperature: 0.2
  self_ensemble_repeats: 3
  low_confidence_policy: retrieve_only
  baseline_models:
    - google/deplot
    - PaddlePaddle/PP-Chart2Table_safetensors

embedding:
  backend: qwen3_vl
  model: Qwen/Qwen3-VL-Embedding-2B
  model_source: modelscope
  modelscope_id: Qwen/Qwen3-VL-Embedding-2B
  local_path:
  dimension: 2048
  normalize: true
  query_instruction: Retrieve scientific evidence that answers the question.

vector_store:
  backend: qdrant
  mode: local
  path: data/index/qdrant
  collection: scientific_evidence
  distance: cosine
  per_type_top_k: 25

graph_index:
  hidden_dimension: 256
  layers: 2
  heads: 4
  residual: true
  add_reverse_edges: true

reranker:
  enabled: true
  backend: qwen3_vl
  model: Qwen/Qwen3-VL-Reranker-2B
  model_source: modelscope
  modelscope_id: Qwen/Qwen3-VL-Reranker-2B
  local_path:
  top_n: 100

retrieval:
  candidate_hops: 2
  lambda_values: [0.5, 1.0, 2.0]
  max_nodes_per_paper: 100
  budget:
    text_tokens: 4096
    image_unit: 512
  relation_costs:
    caption_of: 0.10
    refers_to: 0.20
    derived_from: 0.10
    next_sentence: 0.50
    contains: 0.30
    semantically_similar: 1.20

generation:
  provider: openai_compatible
  base_url: http://localhost:8001/v1
  model: Qwen/Qwen3-VL-4B-Instruct
  require_evidence_ids: true
