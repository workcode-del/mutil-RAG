# 默认单环境、本进程运行。HTTP模式只用于显存隔离或远程部署。
runtime:
  device: cuda
  qwen3_vl_retrieval_repo: third_party/Qwen3-VL-Embedding

# 模型始终先检查local_path；不存在时才从ModelScope下载到统一缓存。
model_download:
  source: modelscope
  cache_dir: data/models

chart:
  # 主环境中的Transformers 4.57.6需同时兼容MinerU与Qwen检索。
  # PP-Chart2Table依赖Transformers 5.x，因此默认通过外部多模态API解析折线图。
  backend: openai_compatible
  base_url: http://localhost:8001/v1
  model: Qwen/Qwen3-VL-4B-Instruct
  api_key_env: PAPER_RAG_API_KEY
  timeout: 120
  temperature: 0.2
  self_ensemble_repeats: 3
  extraction_min_confidence: 0.67

embedding:
  backend: qwen3_vl
  model: Qwen/Qwen3-VL-Embedding-2B
  model_source: modelscope
  modelscope_id: Qwen/Qwen3-VL-Embedding-2B
  local_path:
  dimension: 2048
  text_batch_size: 64
  image_batch_size: 8
  query_instruction: Retrieve scientific evidence that answers the question.

vector_store:
  mode: local
  path: data/index/qdrant
  collection: scientific_evidence
  per_type_top_k: 25
  upload_batch_size: 4096
  upload_parallel: 1

graph_index:
  hidden_dimension: 256
  layers: 2
  heads: 4
  rgcn_bases: 8
  # A800默认使用BF16混合精度；损失、模型主参数和AdamW状态保持FP32。
  precision: auto

reranker:
  enabled: true
  backend: qwen3_vl
  model: Qwen/Qwen3-VL-Reranker-2B
  model_source: modelscope
  modelscope_id: Qwen/Qwen3-VL-Reranker-2B
  local_path:
  top_n: 10

retrieval:
  candidate_hops: 2
  min_edge_confidence: 0.8
  lambda_values: [0.5, 1.0, 2.0]
  slot_weight: 0.4
  entity_weight: 0.3
  redundancy_weight: 0.2
  budget:
    text_tokens: 4096
    image_unit: 512
  relation_costs:
    caption_of: 0.10
    refers_to: 0.20
    derived_from: 0.10
    next_sentence: 0.50
    contains: 0.30
    semantically_similar: 1.20

generation:
  base_url: https://chat.tianhe-tech.com/v1/
  model: Qwen3.5-397B-A17B
  timeout: 600
