[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-evidence-rag"
version = "0.1.0"
description = "Fine-grained multimodal RAG over scientific-paper evidence graphs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Research prototype; third-party components retain their own licenses" }
authors = [{ name = "Thesis project" }]
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "mypy>=1.14,<2"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1"]
app = ["streamlit>=1.41,<2", "requests>=2.32,<3"]
vector = ["qdrant-client>=1.18,<2"]
graph = ["networkx>=3.4,<4", "pcst-fast>=1.0.10,<2"]
unified = [
  "accelerate==1.14.0",
  "datasets==4.4.2",
  "decord==0.6.0",
  "fastapi==0.141.1",
  "ipykernel==7.1.0",
  "matplotlib==3.10.8",
  "mineru[core]==3.4.4",
  "modelscope==1.39.1",
  "networkx==3.5",
  "ninja==1.13.0",
  "opencv-python-headless==4.12.0.88",
  "pcst-fast==1.0.10",
  "Pillow==11.3.0",
  "pytest==8.4.2",
  "PyMuPDF==1.28.2",
  "qdrant-client==1.19.0",
  "qwen-vl-utils==0.0.14",
  "requests==2.32.5",
  "scipy==1.16.3",
  "streamlit==1.61.1",
  "torch-geometric==2.8.0.post1",
  "transformers==4.57.6",
  "uvicorn[standard]==0.52.1",
]

[project.scripts]
paper-rag = "paper_rag.cli:main"
paper-rag-serve = "paper_rag.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
